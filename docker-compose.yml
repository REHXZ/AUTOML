version: '3.8'
services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng-config:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    # Optional: limit CPU/RAM if running alongside heavy LLMs
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 512M