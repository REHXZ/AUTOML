# Inherit official defaults, then override only what we need
use_default_settings: true

general:
  instance_name: "SearXNG"
  debug: false

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "5b61d34474ab97389fee4bc64de8d2a4"  # Run: openssl rand -hex 32
  limiter: false          # ✅ Crucial for AI agents (prevents 403)
  image_proxy: true
  method: "POST"          # ✅ Handles long AI queries safely

search:
  formats:
    - html
    - json                # ✅ Required for programmatic access
  default_lang: "en"
  safe_search: 0          # 0=off, 1=moderate, 2=strict

engines:
  # Enable reliable, fast engines for AI retrieval
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
  - name: google
    engine: google
    shortcut: g
    disabled: false
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false