[project]
name = "aiml-discovery-training-ui"
version = "0.1.0"
description = "Local-first Streamlit UI for tabular AI/ML discovery and training."
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.36",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "joblib>=1.4",
    "plotly>=5.22",
    "openpyxl>=3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

